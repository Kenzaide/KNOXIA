<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EEF4FF" />
    <meta name="description" content="KNOXIA — Learn smarter. Grow together." />
    <script>
      // Set the theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var v = localStorage.getItem('knoxia-theme');
          var dark = v === 'dark' || (v !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0A1120' : '#EEF4FF');
        } catch (e) {}
      })();
    </script>
    <title>KNOXIA — Learn Smarter. Grow Together.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
